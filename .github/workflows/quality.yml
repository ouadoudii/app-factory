name: App Factory Quality Gate
on:
  push:
    branches: [main, factory/bootstrap]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Unit, security and contract tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Real-browser desktop and mobile journeys
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Upload browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-factory-browser-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
